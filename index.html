*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 40px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.logo{font:800 28px system-ui,sans-serif;letter-spacing:-.02em}.logo i{font-style:normal;color:var(--pri)}

input,select{width:100%;padding:11px;margin-top:8px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
button{font:700 15px inherit;font-family:inherit;cursor:pointer;border-radius:10px;padding:11px 16px;border:0;background:var(--pri);color:#fff}
button.alt{background:none;color:var(--pri);border:1px solid var(--pri)}button.full{width:100%;margin-top:10px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.err{color:var(--bad);font-size:14px;margin-top:8px;min-height:1em}
.code{font:700 15px ui-monospace,monospace;background:var(--bg);padding:4px 8px;border-radius:6px}
.hero{display:grid;gap:24px;padding:12px 0 28px}.hero h1{font-size:clamp(34px,8vw,56px);line-height:1.02;letter-spacing:-.03em;font-weight:800;margin:0 0 12px}.hero p{font-size:18px;color:var(--mut);max-width:46ch;margin:0}
.ctas{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.sec{margin-top:36px}.sec>h2{font-size:28px;margin-bottom:14px;letter-spacing:-.02em}.n{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--pri);color:#fff;font-weight:800;margin-bottom:8px}
ul.ck{padding-left:18px;margin:8px 0 0}.live .r{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.live .r:last-child{border:0}
@media(min-width:720px){.hero{grid-template-columns:1.2fr 1fr;align-items:center}}
footer.f{margin-top:40px;color:var(--mut);font-size:14px;text-align:center}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.stat{border-radius:12px;padding:12px;text-align:center}.stat b{display:block;font-size:26px}.stat span{font-size:13px}
.tabs{display:flex;gap:6px;margin-bottom:14px}.tabs button{flex:1;background:var(--card);color:var(--ink);border:1px solid var(--line);padding:10px 6px}.tabs button[aria-pressed=true]{border-color:var(--pri);color:var(--pri)}
.note{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:10px}
</style></head><body>
<div class="wrap" id="wrap"><header><button class="logo" id="home" aria-label="Ir al inicio" style="border:0;background:none;color:inherit;padding:0">Obvio<i>!</i></button><button class="alt" id="out" hidden>Salir</button></header><main id="app"></main></div>

 if(p)return p.estado=="confirmado"?"ok":"wait";return new Date().getDate()>i.dia_pago?"mora":"pend"}
let U,P,TAB="inm",PAY=null;const POLITICA="2026-11";

function home(){$("out").hidden=true;$("wrap").style.maxWidth="920px";
 app.innerHTML=`<section class="hero"><div><h1>El arriendo, claro para los dos.</h1><p>Recordatorios, pago por Bre-B o transferencia y comprobante en un solo lugar. Propietarios e inquilinos ven lo mismo: qué se paga, cuándo y si ya quedó al día. Sin comisión de pasarela.</p>
 <div class="ctas"><button id="h-in">Entrar</button><button class="alt" id="h-up">Crear cuenta</button></div></div>
 <div class="card live"><div class="row" style="padding-bottom:8px"><b>Noviembre</b>${bd("ok")}</div><div class="r"><span>Apto 302</span>${bd("ok")}</div><div class="r"><span>Bodega Zona Franca</span>${bd("wait")}</div><div class="r"><span>Finca El Roble</span>${bd("pend")}</div></div></section>
 <section class="sec"><h2>Así funciona</h2><div class="grid"><div class="card"><span class="n">1</span><h3>Registra tus inmuebles</h3><p class="mut">Casas, apartamentos, bodegas, oficinas o fincas, con su valor y fecha de pago.</p></div><div class="card"><span class="n">2</span><h3>El inquilino paga</h3><p class="mut">Por Bre-B o transferencia, y avisa en la app. Obvio le recuerda antes de la fecha.</p></div><div class="card"><span class="n">3</span><h3>Confirmas y listo</h3><p class="mut">Ambos ven el estado al día y el inquilino conserva su comprobante.</p></div></div></section>
 <section class="sec"><div class="grid"><div class="card"><h3>Para propietarios</h3><ul class="ck"><li>Quién paga a tiempo, quién está en mora y quién al día</li><li>Todos tus inmuebles en un solo panel</li><li>Sin comisión de pasarela</li></ul></div><div class="card"><h3>Para inquilinos</h3><ul class="ck"><li>Recordatorio antes de cada fecha de pago</li><li>Datos de pago siempre a la mano</li><li>Comprobante cuando pagas</li></ul></div></div></section>
 <section class="sec"><h2>Planes</h2><div class="grid"><div class="card"><h3>Gratis</h3><div class="mut">2 inmuebles</div></div><div class="card"><h3>Básico</h3><div class="mut">Hasta 5 inmuebles</div></div><div class="card"><h3>Plus</h3><div class="mut">Hasta 12 inmuebles</div></div><div class="card"><h3>Empresarial</h3><div class="mut">Inmobiliarias y administradores</div></div></div></section>

function auth(modo="in"){$("out").hidden=true;$("wrap").style.maxWidth="560px";
 app.innerHTML=`<div class="card"><h2>${modo=="in"?"Entrar":"Crear cuenta"}</h2>
 ${modo=="up"?`<input id="nom" placeholder="Tu nombre" autocomplete="name"><select id="rol"><option value="propietario">Soy propietario</option><option value="inquilino">Soy inquilino</option></select>`:""}
 <input id="em" type="email" placeholder="Correo" autocomplete="email"><input id="pw" type="password" placeholder="Contraseña (mínimo 6)" autocomplete="${modo=="in"?"current-password":"new-password"}">
 ${modo=="up"?`<label class="mut" style="display:flex;gap:8px;align-items:flex-start;margin-top:10px"><input type="checkbox" id="ac" style="width:auto;margin:3px 0 0"><span>Acepto la <a href="politica.html" target="_blank" rel="noopener">política de tratamiento de datos</a> y autorizo el uso de mis datos para operar Obvio!.</span></label>`:""}<div class="err" id="er"></div><button class="full" id="go">${modo=="in"?"Entrar":"Crear cuenta"}</button>
 <button class="alt full" id="sw">${modo=="in"?"No tengo cuenta":"Ya tengo cuenta"}</button></div>`;
 $("sw").onclick=()=>auth(modo=="in"?"up":"in");
 $("go").onclick=async()=>{const em=$("em").value.trim(),pw=$("pw").value;let r;
  if(modo=="up"){if(!$("ac").checked){$("er").textContent="Debes aceptar la política de tratamiento de datos.";return}localStorage.obvio_rol=$("rol").value;localStorage.obvio_nombre=$("nom").value.trim()||em;r=await db.auth.signUp({email:em,password:pw,options:{emailRedirectTo:location.href.split("#")[0],data:{rol:$("rol").value,nombre:$("nom").value.trim()||em,acepto:new Date().toISOString(),version:POLITICA}}});
   if(!r.error&&!r.data.session){$("er").textContent="Revisa tu correo para confirmar la cuenta y luego entra.";return}}
  else r=await db.auth.signInWithPassword({email:em,password:pw});
  if(r.error)$("er").textContent=r.error.message;else boot()}}
const mes=p=>new Date(p+"T12:00:00").toLocaleDateString("es-CO",{month:"long",year:"numeric"});
function pdf(x,p){const {jsPDF}=window.jspdf,d=new jsPDF(),L=20;
 d.setFontSize(26);d.setTextColor(30,94,255);d.text("Obvio!",L,28);
 d.setFontSize(11);d.setTextColor(90,107,124);d.text("Comprobante de pago de arriendo",L,36);
 d.setDrawColor(221,227,234);d.line(L,42,190,42);
 const f=new Date(p.confirmado_en||p.created_at),fd=f.toLocaleDateString("es-CO",{day:"numeric",month:"long",year:"numeric"});
 const rows=[["Comprobante","OB-"+p.id.slice(0,8).toUpperCase()],["Inmueble",x.nombre],["Tipo",x.tipo],["Inquilino",P.nombre],["Periodo",mes(p.periodo)],["Valor pagado",cop(p.valor)],["Método",p.metodo=="bre-b"?"Bre-B":"Transferencia bancaria"],["Referencia",p.referencia||"-"],["Confirmado el",fd]];
 let y=56;d.setFontSize(12);rows.forEach(r=>{d.setTextColor(90,107,124);d.text(r[0],L,y);d.setTextColor(16,36,58);d.text(String(r[1]),80,y);y+=11});
 d.setDrawColor(221,227,234);d.line(L,y,190,y);
 d.setFontSize(9);d.setTextColor(90,107,124);d.text("Pago registrado por el inquilino y confirmado por el propietario en Obvio!.",L,y+10);
 d.save("comprobante-"+p.periodo.slice(0,7)+".pdf")}
function hist(x,G){const out=[],hoy=new Date(),c0=new Date(x.created_at),ini=new Date(c0.getFullYear(),c0.getMonth(),1);
 for(let k=0;k<6;k++){const d=new Date(hoy.getFullYear(),hoy.getMonth()-k,1);if(d<ini)break;
  const pe=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-01",p=G.find(g=>g.inmueble_id==x.id&&g.periodo==pe),due=new Date(d.getFullYear(),d.getMonth(),x.dia_pago,23,59,59);
  out.push({per:pe,st:p?(p.estado=="por_confirmar"?"wait":(new Date(p.created_at)<=due?"ok":"tarde")):(hoy>due?"mora":"pend")})}
 return out}
const LB={ok:"A tiempo",tarde:"Con atraso",mora:"Sin pago",pend:"Pendiente",wait:"Por confirmar"},CL={ok:"ok",tarde:"pend",mora:"mora",pend:"pend",wait:"wait"};
function histHTML(x,G){if(!x.inquilino_id)return "";const h=hist(x,G),c=h.filter(m=>m.st=="ok"||m.st=="tarde"||m.st=="mora"),a=c.filter(m=>m.st=="ok").length,
 t=c.length?" · puntualidad "+Math.round(a/c.length*100)+"% ("+a+" de "+c.length+")":"";
 return `<details style="margin-top:8px"><summary class="mut" style="cursor:pointer">Historial${t}</summary>${h.map(m=>`<div class="row" style="margin-top:8px"><span>${mes(m.per)}</span><span class="badge ${CL[m.st]}">${LB[m.st]}</span></div>`).join("")}</details>`}
const VAPID_PUBLIC="BH7vsfO0fOWgCEEqgI872EWPpk-gIDPrhbLs26002M_HpT109l4z_lMdDHYyrnI3K8jVm_ZCVrIbs7-LPlNfXBA";
const b64=t=>{t=t.replace(/-/g,"+").replace(/_/g,"/");return Uint8Array.from(atob(t+"=".repeat((4-t.length%4)%4)),c=>c.charCodeAt(0))};
async function pushCard(){const d=document.createElement("div");d.className="card";app.appendChild(d);
 if(!("serviceWorker"in navigator&&"PushManager"in window)){d.innerHTML='<b>Avisos</b><p class="mut" style="margin:4px 0 0">Este navegador no admite notificaciones. En iPhone, instala la app desde Compartir > Agregar a inicio.</p>';return}
 const reg=await navigator.serviceWorker.ready,sub=await reg.pushManager.getSubscription();
 if(sub&&Notification.permission=="granted"){const j=sub.toJSON();await db.rpc("registrar_push",{p_endpoint:j.endpoint,p_p256dh:j.keys.p256dh,p_auth:j.keys.auth});d.innerHTML='<b>Avisos activados</b><p class="mut" style="margin:4px 0 0">Recibirás notificaciones en este dispositivo.</p>';return}
 d.innerHTML='<b>Avisos en este dispositivo</b><p class="mut" style="margin:4px 0 0">Recibe una notificación aunque la app esté cerrada.</p><div class="err" id="pe"></div><button class="full" id="pb">Activar avisos</button>';
 $("pb").onclick=async()=>{try{if(await Notification.requestPermission()!="granted"){$("pe").textContent="No diste permiso para notificar.";return}
  const s=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64(VAPID_PUBLIC)}),j=s.toJSON();
  const r=await db.rpc("registrar_push",{p_endpoint:j.endpoint,p_p256dh:j.keys.p256dh,p_auth:j.keys.auth});if(r.error)throw r.error;
  d.innerHTML='<b>Avisos activados</b><p class="mut" style="margin:4px 0 0">Recibirás notificaciones en este dispositivo.</p>'}catch(e){$("pe").textContent=e.message}}}
function live(){if(live.c)return;live.c=1;try{db.channel("pagos-"+Date.now()).on("postgres_changes",{event:"*",schema:"public",table:"pagos"},()=>{
 if(P.rol=="propietario"){const f=$("n");if(f&&(f.value||$("v").value||$("d").value)){$("er").textContent="Llegó un pago nuevo. Termina o borra el formulario y recarga la página.";return}owner()}
 else if(!($("f")&&$("f").files.length))tenant()}).on("postgres_changes",{event:"*",schema:"public",table:"suscripcion_pagos"},()=>{if(P&&P.rol=="propietario"&&(TAB=="plan"||TAB=="cuenta"||TAB=="admin"))owner()}).subscribe()}catch(e){}}
function aceptar(){app.innerHTML=`<div class="card"><h2>Tratamiento de datos</h2><p class="mut">Para seguir usando Obvio! necesitamos tu autorización para tratar tus datos personales, según nuestra <a href="politica.html" target="_blank" rel="noopener">política de tratamiento de datos</a>.</p><div class="err" id="er"></div><button class="full" id="ok">Acepto</button></div>`;
 $("ok").onclick=async()=>{const r=await db.rpc("aceptar_datos",{p_version:POLITICA});if(r.error)$("er").textContent=r.error.message;else boot()}}
async function boot(){const {data:{session}}=await db.auth.getSession();U=session&&session.user;if(!U)return home();$("wrap").style.maxWidth="560px";
 $("out").hidden=false;
 P=(await db.from("profiles").select("*").eq("id",U.id).maybeSingle()).data;
 if(!P){const m=U.user_metadata||{},rol=m.rol||localStorage.obvio_rol||"propietario",nombre=m.nombre||localStorage.obvio_nombre||U.email;
  const r=await db.from("profiles").insert({id:U.id,nombre,rol,email:U.email,acepto_datos_en:m.acepto||null,version_politica:m.version||null});if(r.error){app.innerHTML=`<div class="card err">${r.error.message}</div>`;return}
  P=(await db.from("profiles").select("*").eq("id",U.id).maybeSingle()).data}
 if(!P.acepto_datos_en)return aceptar();live();P.rol=="propietario"?owner():tenant()}

const tabs=()=>`<div class="tabs"><button data-tab="inm" aria-pressed="${TAB=="inm"}">Inmuebles</button><button data-tab="plan" aria-pressed="${TAB=="plan"}">Mi plan</button><button data-tab="cuenta" aria-pressed="${TAB=="cuenta"}">Cuenta</button>${P.es_admin?`<button data-tab="admin" aria-pressed="${TAB=="admin"}">Admin</button>`:""}</div>`;

async function owner(msg=""){
 P=(await db.from("profiles").select("*").eq("id",U.id).maybeSingle()).data||P;
 if(P.estado=="suspendido"){app.innerHTML='<div class="card"><h2>Cuenta suspendida</h2><p class="mut">Contacta al administrador de Obvio!.</p></div>';return}

async function adminUI(msg=""){
 const [ow,sp]=await Promise.all([db.rpc("admin_propietarios"),db.from("suscripcion_pagos").select("*").order("created_at",{ascending:false})]);
 if(ow.error){app.innerHTML='<div class="card err">'+ow.error.message+'</div>';app.insertAdjacentHTML("afterbegin",tabs());bindTabs();return}
 const O=ow.data||[],SP=sp.data||[],nom=id=>{const o=O.find(x=>x.uid==id);return o?o.nombre+" · "+(o.email||""):"Propietario eliminado"};

 <div class="card"><h3>Facturas por subir (${sinf.length})</h3>${sinf.map(x=>`<div class="note" data-ow="${x.propietario_id}"><b>${nom(x.propietario_id)}</b><br><span class="mut">${x.plan} ${x.periodo} · ${cop(x.valor)}</span><input type="file" accept="application/pdf"><button class="full" data-sf="${x.id}">Subir factura</button></div>`).join("")||'<p class="mut" style="margin:6px 0 0">No hay facturas pendientes.</p>'}</div>
 <div class="card"><h3>Propietarios (${O.length})</h3>${O.map(o=>`<details style="margin-top:12px"><summary style="cursor:pointer"><b>${o.nombre}</b> <span class="badge ${o.plan=="gratis"?"wait":"ok"}">${o.plan}</span>${o.estado=="suspendido"?' <span class="badge mora">Suspendido</span>':""}</summary>
  <div class="mut" style="margin-top:6px">${o.email||""}<br>${o.n_activos} de ${o.n_inmuebles} inmuebles activos${o.plan_vence?" · vence "+fecha(o.plan_vence):""}</div>
  <select><option value="basico">Básico</option><option value="plus">Plus</option><option value="empresarial">Empresarial</option><option value="gratis">Gratis</option></select>
  <label class="mut" style="display:block;margin-top:8px">Vence (opcional)</label><input type="date">
  <button class="full" data-sp="${o.uid}">Activar este plan</button>
  <div class="row" style="gap:8px;margin-top:8px"><button class="alt" style="flex:1" data-cx="${o.uid}">Cancelar plan</button><button class="alt" style="flex:1" data-st="${o.uid}|${o.estado=="activo"?"suspendido":"activo"}">${o.estado=="activo"?"Suspender":"Reactivar"}</button></div>
  <button class="alt full" ${BAD.replace("flex:1;","")} data-el="${o.uid}">Eliminar cuenta</button></details>`).join("")||'<p class="mut" style="margin:6px 0 0">Aún no hay propietarios.</p>'}</div>`;
 app.insertAdjacentHTML("afterbegin",tabs());bindTabs();
